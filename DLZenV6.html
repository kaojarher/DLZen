<style>

#bg .card{width:var(--bw,160px);flex:none;border-radius:0;padding:0;box-shadow:none;transform:none;cursor:default}#bg .card .in{inset:0;border-radius:0}

@keyframes mqs{to{transform:translateX(-50%)}}
.kb{display:flex;gap:12px;align-items:flex-end;margin:6px 0 10px}.kbp{width:min(240px,72vw);flex:none;cursor:pointer}@media(max-width:600px){.kb{flex-direction:column;align-items:center}.kbb{width:100%;margin-bottom:0}.kbb::before{display:none}}.kbb{position:relative;flex:1;background:#241a4af2;border:1px solid #8a72d8;border-radius:14px;padding:10px 12px 12px;min-height:84px;margin-bottom:14px}.kbb::before{content:'';position:absolute;left:-8px;bottom:24px;width:14px;height:14px;background:#241a4a;border-left:1px solid #8a72d8;border-bottom:1px solid #8a72d8;transform:rotate(45deg)}.kbb b{font-size:14px;color:#ffe9a8}.kbb p{margin:6px 0 0;font-size:15px;line-height:1.6}.kbm{display:flex;gap:10px;align-items:center;text-align:left;margin:12px 0 0;font-size:14px;line-height:1.6}.kbm .card{width:64px;flex:none}
</style></head><body>
<header><h1>✦ 修仙幻想</h1><span><button class="alt sm" id="snd"></button> <button class="alt sm" id="mus"></button> <button class="alt sm" id="vox"></button> <button class="alt sm" id="inst">安裝 App</button></span><div class="coin"><i class="cn"></i> <span id="coin"></span> <i class="ds"></i> <span id="dust"></span></div></header>

<script>
const NM=['月影','星空','霜刃','焰舞','雷鳴','翠林','暮光','夜幕','白羽','赤霞','滄海','蒼穹','幻蝶','玄鐵','落櫻'];
const TY=['法修','符修','劍仙','丹師','體修','女修','陣修','魔修'];
const sv=(c,d)=>`<svg viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.2em">${d}</svg>`;
const SK=[{i:sv('#ffb066','<path d="M4 20l3-1 12-12-2-2L5 17z"/><path d="M14 6l4 4"/>'),n:'反擊',d:'近距離攻擊對手時，若落敗仍會造成反擊傷害（自身戰力 30%）'},{i:sv('#6ff0b0','<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.5-7 10-7 10z"/>'),n:'治療',d:'每次對決後，為己方隊伍回復 3 點生命'},{i:sv('#ffe14a','<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>'),n:'雷擊',d:'對決時戰力額外提升 25%'}];
const RAR={common:'COMMON',cosplay:'cosplay',epic:'EPIC',legend:'LEGEND'};
const EL=['火','水','木','光','暗'],EC=['#e8451e','#2a8cff','#2fae4a','#d9a400','#7a3fd0'];
const emul=(a,b)=>{const w=[[0,2],[2,1],[1,0],[3,4],[4,3]];return w.some(([x,y])=>x==a&&y==b)?1.3:w.some(([x,y])=>x==b&&y==a&&x<3)?.8:1};
let AC;const snd=(f,d=.09,t='square',v=.05)=>{if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}};
const jingle=a=>a.forEach((f,i)=>setTimeout(()=>snd(f,.14,'triangle',.07),i*110));
/* ===== 背景音樂（Kevin MacLeod / incompetech.com，CC BY 3.0）===== */
const BGM_BASE='https://incompetech.com/music/royalty-free/mp3-royaltyfree/';
// 每個場景可放多首備援曲目：第一首載入失敗會自動換下一首。想換歌只要改這裡的檔名。
const BGM_TRACKS={
 menu:['Eastern Thought','Tea Roots'],            // 對戰準備／圖鑑／任務／商店／活動
 gacha:['Lotus','Mystic Force hi'],                // 抽卡
 battle:['Mountain Emperor','Asian Drums','Exotic Battle'], // 一般關卡對戰（日式太鼓、節奏明快）
 boss:['Final Battle of the Dark Wizards','Clash Defiant'] // BOSS 關
};

/* ===== 招式語音（瀏覽器內建語音合成，免費；每場 12 名角色各有不同音調／語速）===== */
// [音調, 語速]：12 組刻意拉開差距，高亢快速→低沉慢速都有
const VOX=[[2.0,1.0],[1.55,1.25],[1.8,.88],[1.3,1.15],[1.65,1.05],[1.15,.9],[1.9,1.2],[1.4,.82],[1.7,1.3],[1.05,1.0],[1.5,.95],[1.25,1.22]];
let vxVoice=null;
const vxPick=()=>{if(vxVoice)return vxVoice;try{const vs=speechSynthesis.getVoices();if(!vs.length)return null;
 // 只選國語：排除粵語（zh-HK、yue-*、Sin-Ji、名稱含粵語/廣東話/Cantonese）
 const yue=v=>/HK|yue|cantonese/i.test(v.lang)||/粵|粤|廣東|广东|cantonese|sin-?ji|sinji/i.test(v.name);
 const zh=vs.filter(v=>(/^(zh|cmn)/i.test(v.lang)||/chinese|中文|國語|国语|普通話|普通话|mandarin/i.test(v.name))&&!yue(v));
 const tw=zh.filter(v=>/TW|Hant|台灣|臺灣|Taiwan/i.test(v.lang+v.name));
 const pool=tw.length?tw:zh;
 const fem=pool.find(v=>/mei-?jia|ting-?ting|yating|hanhan|hsiao|xiaoxiao|xiaoyi|huihui|female|女/i.test(v.name));
 vxVoice=fem||pool[0]||null}catch(e){}return vxVoice};
try{speechSynthesis.onvoiceschanged=()=>{vxVoice=null}}catch(e){}
// 依角色編號固定對應（同一角色音色穩定），撞號時往後找空位，確保同場不重複
function vAssign(us){const used=new Set();us.forEach(u=>{let k=((u.c&&u.c.id)||0)*7%12;while(used.has(k))k=(k+1)%12;used.add(k);u.vo=VOX[k]})}
const SHOUT=['看我的{m}！','吃我這招{m}！','接招吧，{m}！','嚐嚐我的{m}！','小心了，{m}！','看招，{m}！','讓你見識一下{m}！','我來了，{m}！','別小看我，{m}！','這一招，{m}！','準備好了嗎？{m}！','躲得掉嗎？{m}！','讓你瞧瞧我的厲害，{m}！','既然如此，{m}！','去吧，{m}！'];
const SHOUT_ULT=['既然這樣，就讓你見識一下我的絕招，{m}！','你逼我的，{m}！','全力一擊，{m}！','這就是我的奧義，{m}！','結束了，{m}！','以天地之名，{m}！','燃盡一切吧，{m}！','讓你看看真正的實力，{m}！','我不會再留手了，{m}！','天劫降臨，{m}！'];
let shLast=-1;
const shout=(m,ult)=>{const L=ult?SHOUT_ULT:SHOUT;let i;do{i=Math.floor(Math.random()*L.length)}while(i===shLast&&L.length>1);shLast=i;return L[i].replace('{m}',m)};
// 回傳 Promise：整句喊完（或超時保險）才 resolve，戰鬥流程會等它再計算傷害
function voice(u,txt,ult){
 if(S.novox||!u||!u.vo||!window.speechSynthesis)return Promise.resolve();
 return new Promise(res=>{try{
  const n=String(txt||'').replace(/[⚡\s【】]/g,'');if(!n)return res();
  const t=S.fast?n:shout(n,ult);
  const m=new SpeechSynthesisUtterance(t),v=vxPick();if(v){m.voice=v;m.lang=v.lang}else m.lang='zh-TW';
  const f=S.fast?1.25:1;m.pitch=Math.min(2,u.vo[0]+(ult?.12:0));m.rate=Math.min(2,Math.max(.6,u.vo[1]*(ult?.92:1)*f));m.volume=1;
  let done=0;const fin=()=>{if(done)return;done=1;clearTimeout(tm);res()};
  const tm=setTimeout(fin,Math.min(9000,1500+t.length*450/m.rate)); // 保險：某些瀏覽器不觸發 onend
  m.onend=fin;m.onerror=fin;
  try{speechSynthesis.resume()}catch(e){}
  speechSynthesis.speak(m)}catch(e){res()}})}
const BGM_VOL=.3;
let bgEl=null,bgKey=null,bgIdx=0,bgWant='menu',bgOn=false,bgTimer=null;
const bgUrl=(k,i)=>BGM_BASE+encodeURIComponent(BGM_TRACKS[k][i])+'.mp3';
function bgFade(el,to,ms,done){clearInterval(el._t);const from=el.volume,st=Date.now();el._t=setInterval(()=>{const p=Math.min(1,(Date.now()-st)/ms);try{el.volume=Math.max(0,Math.min(1,from+(to-from)*p))}catch(e){}if(p>=1){clearInterval(el._t);done&&done()}},50)}
function bgStop(){if(bgEl){const o=bgEl;bgEl=null;bgKey=null;bgFade(o,0,500,()=>{o.pause();o.src=''})}}
function bgStart(k,i){
 const o=bgEl;if(o){bgFade(o,0,600,()=>{o.pause();o.src=''})}

 bgFade(a,BGM_VOL,900)}

/* ===== 卡圖修仙者圖(CSS Sprite)設定 =====
   換圖只需替換對應的 cards1~3.jpg：格線版面(欄×列)相同即可，任何解析度皆可，位置會依實際圖片尺寸自動換算。
   新增圖片檔時，在 sheets 加一筆即可；卡片編號依 sheets 順序、由左至右、由上而下連續對應。
   版面改變時，只需調整該張圖的 cols / rows / ref。 */
const SPRITE={
 ar:1.45,                     // 卡片圖框 高/寬 比
 top:.25,                     // 圖比圖框更高時，垂直裁切位置：0=靠上 1=靠下
 left:.5,                     // 圖比圖框更寬時，水平裁切位置：0=靠左 1=靠右
 sheets:[                     // ref=基準尺寸[寬,高]px；inset=每格內縮[左右,上下]px(去掉邊框)，皆以 ref 計
  {src:'cards1.jpg',cols:5,rows:3,ref:[1376,768],inset:[9,10]},
  {src:'cards2.jpg',cols:5,rows:3,ref:[1376,768],inset:[9,10]},
  {src:'cards3.jpg',cols:5,rows:3,ref:[1376,768],inset:[9,10]}
 ]
};
const sprStyle=document.head.appendChild(document.createElement('style')),sprCss=[];
function buildSheet(si,iw,ih){
 const{ar,top,left}=SPRITE,{src,cols,rows,ref:[rw,rh],inset:[ix,iy]}=SPRITE.sheets[si],
  base=SPRITE.sheets.slice(0,si).reduce((n,s)=>n+s.cols*s.rows,0),pc=n=>+(n*100).toFixed(4)+'%';let css='';
 for(let k=0;k<cols*rows;k++){
  const r=Math.floor(k/cols),c=k%cols;
  const fx=(c*rw/cols+ix)/rw,fw=(rw/cols-2*ix)/rw,fy=(r*rh/rows+iy)/rh,fh=(rh/rows-2*iy)/rh;
  const cw=fw*iw,ch=fh*ih,tall=ch>=cw*ar;                 // 等同 background-size:cover 的視窗計算
  const ww=tall?fw:ch/ar/iw,wh=tall?cw*ar/ih:fh;
  const wx=fx+left*(fw-ww),wy=fy+top*(fh-wh);
  css+=`.card .in.a${base+k+1}{background-image:url(${src});background-repeat:no-repeat;background-size:${pc(1/ww)} ${pc(1/wh)};background-position:${pc(wx/(1-ww))} ${pc(wy/(1-wh))}}`;
 }
 sprCss[si]=css;sprStyle.textContent=sprCss.join('');
}
SPRITE.sheets.forEach((sh,i)=>{buildSheet(i,...sh.ref);
 Object.assign(new Image(),{onload(){buildSheet(i,this.naturalWidth,this.naturalHeight)},src:sh.src})});

${fbar(0)}<div class="grid wide">${owned.length?'':'<p class="tip">沒有符合條件的卡牌</p>'}${owned.map(c=>`<div data-pick="${c.id}">${card(c,{cls:S.deck.includes(c.id)?'sel':''})}</div>`).join('')}</div>`;

async function fight2(){

bgm(boss?'boss':'battle');const bp=boss?POOL.filter(c=>c.r=='legend'||c.r=='epic'):POOL;
let en=Array.from({length:6},()=>({c:bp[Math.floor(Math.random()*bp.length)],hp:0}));if(boss){const b=POOL[CH[tw?(tw/5-1)%6:(st-1)/5|0].boss-1];en[0].c=Object.assign({},b,{p:45,name:'【BOSS】'+b.name})}const et0=en.reduce((a,x)=>a+x.c.p,0);en.forEach(x=>x.hp=Math.max(3,Math.round(x.c.p*target/et0)));
vAssign([...me,...en]);const M={f:me.slice(0,3),r:me.slice(3)},E={f:en.slice(0,3),r:en.slice(3)};

const qi=u=>`<div class="qi">${u.q>=2?'⚡必殺':'●'.repeat(u.q||0)+'○'.repeat(2-(u.q||0))}${u.bn>0?'🔥':''}${u.fz?'❄':''}${u.wk>0?'☠':''}</div>`;
const row=(s,k)=>s.f.map((u,i)=>u?card(u.c,{p:Math.max(0,u.hp)}).replace('class="card','class="card s'+k+i).replace(/<\/div>$/,qi(u)+'</div>'):'<div class="card empty"></div>').join('');
const pile=(n,r)=>`<div style="text-align:${r?'right':'left'}"><div class="pile">${n}</div></div>`;
const paint=(label,opp)=>{$('#app').innerHTML=`<div class="tip">${lab}${boss?'（BOSS）':''}｜Guest ${tot(E)} ｜ Deacon ${tot(M)}</div>${pile(E.r.length,0)}<div class="grid">${row(E,'e')}</div><div class="banner ${opp?'opp':''}">${label}</div><div class="grid">${row(M,'m')}</div>${pile(M.r.length,1)}<div class="log" id="log"></div>${S.manual?'<button class="alt" id="ul" style="display:none">⚡ 發動必殺</button> <button class="alt" id="au">自動完成本回合</button>':''}`};
const pop=(k,i,t,x='')=>{const e=$('.s'+k+i);if(e){e.classList.add('hit');e.insertAdjacentHTML('beforeend',`<div class="dmg ${x}">${t}</div>`)}};
const log=t=>{const l=$('#log');if(l)l.innerHTML=t};
let au=0,ul=0;const pick=(i,B,j)=>new Promise(r=>{if(au)return r(j);const m=$('.sm'+i);m&&m.classList.add('act');ul=0;const rdy=M.f[i]&&M.f[i].q>=2,ub=$('#ul');if(rdy&&ub){ub.style.display='';ub.onclick=()=>{ul=ul?0:1;ub.textContent=ul?'⚡ 必殺已選擇（點選敵人施放）':'⚡ 發動必殺'}}log(rdy?'氣已蓄滿！可按「⚡發動必殺」，再點選敵人':'點選要攻擊的敵人');
[0,1,2].forEach(k=>{const e=$('.se'+k);if(e&&B.f[k]){e.classList.add('tg');e.onclick=()=>r(k);const em=emul(M.f[i].c.el,B.f[k].c.el);if(em!=1)e.insertAdjacentHTML('beforeend',`<div class="ad ${em<1?'bad':''}">${em>1?'▲':'▼'}</div>`)}});const b=$('#au');if(b)b.onclick=()=>{au=1;r(j)}});
async function turn(A,B,ka,kb,label,opp){
if(A===M)au=0;paint(label,opp);await sl(900);
A.f.forEach(u=>{if(u&&u.c.sk==1){const w=A.f.filter(x=>x).sort((a,b)=>a.hp-b.hp)[0];w.hp+=5}});A.f.forEach(u=>{if(u&&u.wk>0)u.wk--});paint(label,opp);let bu=0;A.f.forEach((u,i)=>{if(u&&u.bn>0){u.hp-=u.bd;u.bn--;bu=1;pop(ka,i,'🔥-'+u.bd);if(u.hp<=0)A.f[i]=null}});if(bu){await sl(700);paint(label,opp)}
for(let i=0;i<3;i++){const a=A.f[i];if(!a)continue;if(a.fz){a.fz=0;log(`${a.c.name} 被凍結，無法行動`);paint(label,opp);log(`${a.c.name} 被凍結，無法行動`);await sl(800);continue}let j=B.f[i]?i:B.f.findIndex(x=>x);if(j<0)break;if(S.manual&&A===M)j=await pick(i,B,j);const d=B.f[j];
const el=a.c.el,cm=CM[a.c.id-1]||[],man=S.manual&&A===M,ult=(a.q||0)>=2&&(!man||au||ul),vr=a.c.id%2,mvn=ult?(cm[1]||MV[el][3]):(cm[0]||MV[el][((a.c.id||0)+(a.n=(a.n||0)+1))%3]);a.q=ult?0:Math.min(2,(a.q||0)+1);ul=0;
const cr=(ult&&el==3)||Math.random()<.15,e0=$('.s'+ka+i);if(e0){e0.style.zIndex=6;e0.insertAdjacentHTML('beforeend',`<div class="mvn ${ult?'ult':''} ${cr?'crit':''}" style="background:${MCOL[el]};left:${['0','50%','100%'][i]};--mx0:${['0%','-50%','-100%'][i]}">${ult?'⚡ ':''}${mvn}</div>`)}await Promise.all([voice(a,mvn,ult),sl(ult?700:450)]);
const em0=emul(el,d.c.el),em=ult&&el==3?Math.max(1,em0):em0;const dmg=Math.round(a.hp*(a.c.sk==2?1.25:1)*(a.wk>0?.7:1)*em*(cr?1.5:1)*(ult?UM[el]:1));d.hp-=dmg;let fx='';

else if(el==1){if(vr){const h=Math.round(dmg*.8);d.hp-=h;fx=`｜追擊 ${h}`}else{d.fz=1;fx='｜目標被凍結❄'}}
else if(el==2){if(vr){const h=Math.round(dmg*.2);A.f.forEach(x=>{if(x)x.hp+=h});fx=`｜我方前排各回復 ${h}`}else{const w=A.f.filter(x=>x).sort((x,y)=>x.hp-y.hp)[0],h=Math.round(dmg*.4);w.hp+=h;fx=`｜${w.c.name} 回復 ${h}`}}
else if(el==3){if(vr){a.q=1;fx='｜保留氣量，更快再次必殺'}}
else{if(vr){d.wk=3;fx='｜目標被詛咒☠（攻擊 -30%）'}else{const h=Math.round(dmg*.5);a.hp+=h;fx=`｜吸取 ${h}`}}}
pop(kb,j,'-'+dmg,cr?'crit':em>1?'adv':'');snd(cr?880:em>1?520:300,.1);let t=`${a.c.name} 使出【${mvn}】攻擊 ${d.c.name}，造成 ${dmg}${cr?'（暴擊！）':''}${em>1?'（屬性剋制）':em<1?'（屬性被剋）':''}${fx}`;
if(d.c.sk==0&&d.hp>0){const k=Math.round(d.hp*.3);a.hp-=k;pop(ka,i,'-'+k);t+=`｜${SK[0].i} 反擊 ${k}`}
log(t);await sl(1000);if(d.hp<=0)B.f[j]=null;if(a.hp<=0)A.f[i]=null;paint(label,opp);log(t)}
for(const s of[A,B])for(let i=0;i<3;i++)if(!s.f[i]&&s.r.length)s.f[i]=s.r.shift();
paint(label,opp);await sl(600)}
let win=null;
for(let n=0;n<10&&win===null;n++){
await turn(M,E,'m','e','我的回合 My Turn',0);if(!cnt(E)){win=true;break}
await turn(E,M,'e','m','對手回合 Opponent\'s Turn',1);if(!cnt(M)){win=false;break}}
if(win===null)win=tot(M)>=tot(E);
let rw=10,first=false,R={du:0};{const q=dqs();q.b++;if(win){q.w++;const v=evS();v.w++;if(boss)v.b++}}if(win){S.w++;first=tw?tw>S.tw:st===S.stage&&!(st==30&&S.sty.o30);R=RW(st,tw,first);rw=R.rw;S.dust=(S.dust||0)+R.du;if(tw){if(first){S.tw=tw;if(tw%10==0){rw+=tw*20;S.dust+=20}}}else if(first&&S.stage<30){S.stage++;S.sel=S.stage}jingle([523,659,784])}else{S.l++;snd(160,.4,'sawtooth')}S.coins+=rw;save();
modal(`<h2>${win?'勝利！':'敗北'}</h2><p>${lab}${boss?'（BOSS）':''}｜我方剩餘 ${Math.round(tot(M))}｜對手 ${Math.round(tot(E))}</p><p>獲得 <i class="cn"></i>${rw}${first?'（首通雙倍）':''}${win?`＋靈丹 ${R.du}`:''}${tw&&first&&tw%10==0?'｜里程碑獎勵 +'+tw*20+' 靈石、靈丹 20':''}</p>`);
$('#modal button').onclick=()=>{$('#modal').classList.add('hide');if(win&&boss&&!tw&&!S.sty['o'+st]){S.sty['o'+st]=1;const ci=(st-1)/5|0,R=(ci+1)*100;S.coins+=R;save();story(CH[ci].o.concat([[0,'章節獎勵 '+R+' 靈石已入帳']]),battle)}else battle()}}
/* 3D 傾斜 + 全息 */
let tc=null;const clr=c=>{if(!c)return;c.classList.remove('tilt');['--rx','--ry','--tx','--ty'].forEach(k=>c.style.removeProperty(k))};
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card');if(c!==tc){clr(tc);tc=c}
if(!c||c.classList.contains('lock'))return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
c.classList.add('tilt');const st=c.style;st.setProperty('--rx',((0.5-y)*26).toFixed(1)+'deg');st.setProperty('--ry',((x-0.5)*26).toFixed(1)+'deg');
st.setProperty('--mx',x*100+'%');st.setProperty('--my',y*100+'%');st.setProperty('--bx',x*100+'%');st.setProperty('--by',y*100+'%');
st.setProperty('--tx',((0.5-x)*10).toFixed(1)+'px');st.setProperty('--ty',((0.5-y)*10).toFixed(1)+'px')});
document.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'){clr(tc);tc=null}});
document.addEventListener('pointerleave',()=>{clr(tc);tc=null},true);
const DAY=[50,60,80,100,120,150,300],ld=x=>x.toLocaleDateString('sv');

$('#clm').onclick=()=>{S.coins+=amt;S.daily={d:t,s:st+1};save();snd(660);$('#modal').classList.add('hide')}}

addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
